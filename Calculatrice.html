<!doctype html>

<head>
   <!-- Nécessaire pour validation -->
   <meta charset="utf-8" />

   <!-- Titre de la page -->
   <title>App.Calculatrice</title>

   <!-- Insertion d’un fichier contenant une feuille de style -->
   <link rel="stylesheet" type="text/css" href="" />

   <!-- Feuille de style locale -->
   <style type="text/css">
      table {
            border-collapse: collapse;
            width: 300px;
            text-align: center;
        }

      input[type="text"] {
            width: 100%;
            height: 50px;
            text-align: right;
            font-size: 1.5em;
            box-sizing: border-box;
      }

      input[type="button"] {
            width: 100%;
            height: 50px;
            font-size: 1.2em;
            box-sizing: border-box;
      }


      td[rowspan="2"] {
            position: relative;
      }


      td[rowspan="2"] input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
      }
   </style>

   <!-- Insertion d’un fichier contenant le code JavaScript -->
   <script type="text/javascript" src=""></script>

   <!-- Code JavaScript local -->
   <script type="text/javascript" src="Calculatrice.js">
   </script>
</head>

<body onload="main()">
    <p> Bonjour je suis votre calculatrice personnelle  <br /> par Adama </p>

     <!-- INSÉREZ VOTRE TABLEAU HTML ICI  -->



        
   <table border="2"> 
      <tr>
         <th colspan="5" >CALCULATRICE </th>  
      </tr>
      <tr  >
         <td colspan="5" >
            <input id="screen" type="text" value="0" readonly >   
         </td>
      </tr>
         
      <tr>
         <td><input type="button" value="7" onclick="ajouterValeur('7')"></td>
         <td><input type="button" value="8" onclick="ajouterValeur('8')"></td>
         <td><input type="button" value="9" onclick="ajouterValeur('9')"></td>
         <td><input type="button" value="C" onclick="effacerEcran()"></td>
         <td><input type="button" value="/" onclick="ajouterValeur('/')"></td>
         
      </tr>
         
      <tr >
         <td><input type="button" value="4" onclick="ajouterValeur('4')"></td>
         <td><input type="button" value="5" onclick="ajouterValeur('5')"></td>
         <td><input type="button" value="6" onclick="ajouterValeur('6')"></td>
         <td><input type="button" value="x" onclick="ajouterValeur('*')"></td>
         <td><input type="button" value="-" onclick="ajouterValeur('-')"></td>
      </tr>

      <tr >
         <td><input type="button" value="1" onclick="ajouterValeur('1')"></td>
         <td><input type="button" value="2" onclick="ajouterValeur('2')"></td>
         <td><input type="button" value="3" onclick="ajouterValeur('3')"></td>
         <td><input type="button" value="+" onclick="ajouterValeur('+')"></td>

         <td rowspan="2">
            <input type="button" value="=" onclick="calculer()" style="height: 100%;" >
         </td>
      </tr>

      <tr>
         <td colspan="2"><input type="button" value="0" onclick="ajouterValeur('0')"></td>
         <td><input type="button" value="." onclick="ajouterValeur('.')"></td>
         <td><input type="button" value="(-)" onclick="negatif()"></td>     
    </table>


    
</body>

</html>
